name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # 本仓是 Go + Viva 的 Windows 原生界面：视觉测试用 Viva 的 headless 后端渲染成 PNG，
    # 不依赖打开的窗口，所以在 runner 上能跑。换到 linux 会连 purego 的加载路径一起变，
    # 那不是"换个系统验一遍"，是换了一个构建目标——先别动。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 放第一个：它最快（不到 1 秒），失败原因永远清楚。
      # 本仓在此之前**没有 gofmt 门禁**，于是提交里躺着两个格式不对的文件
      # （`plugins/dsfiles/files.go`、`plugins/dsshortcuts/overlay_test.go`），
      # 谁也没发现——不是有人故意不格式化，是没有任何东西会说出来。
      - name: gofmt
        shell: bash
        run: |
          out=$(gofmt -l cmd internal plugins pluginapi)
          if [ -n "$out" ]; then
            echo "以下文件没格式化（gofmt -w 一下）："
            printf '%s\n' "$out"
            exit 1
          fi

      # 账本一致性：docs/official-parity.md 的合计行必须是**数出来的**。
      # 只防"合计与条目不一致"，防不了"条目写错"——那要靠人对着代码核。
      # 但它至少让"补完一个部件忘了改合计"这件事有个东西会说。
      - name: parity 账本一致
        shell: bash
        run: python scripts/parity-count.py --check

      # 守卫必须可反证 —— 这件事原来靠人记得手工拆一次看它红不红，
      # 而人一定会忘（第 74 轮真撞到：Action 接线守卫的第一版只认 `*ast.Ident`，
      # 漏了仓里最常见的 `env.Act.X`，拆掉接线它也不红）。
      # 这一步在 `git archive HEAD` 的隔离副本里给每条守卫各弄坏一处，要求它当场红，
      # 外加"原样副本必须全绿"的对照组。
      #
      # 它只跑 `go test` + `git archive`，不需要窗口、不需要模型、不需要宿主，
      # 所以能进 CI（`accept-all.sh` 里另外四条要真桌面的进不了）。
      - name: 守卫可反证
        shell: bash
        run: bash scripts/guard-selftest.sh

      # CGO_ENABLED=0：本仓刻意不依赖 C 工具链（purego 走的是运行期 dlopen，
      # 不是 cgo）。开着 cgo 反而会让 runner 上的 go test -race 之外的东西变慢，
      # 也让"本机绿、CI 红"多一类来源。
      - name: build
        shell: bash
        run: CGO_ENABLED=0 go build ./...

      - name: vet
        shell: bash
        run: CGO_ENABLED=0 go vet ./...

      - name: test
        shell: bash
        run: CGO_ENABLED=0 go test ./... -count=1

      # HEAD 单独能不能编译，跟"我的工作树能不能编译"是两件事。
      # 这个仓历史上真的发生过：工作树绿了好几天，HEAD 是红的。
      - name: 干净检出单独编译
        shell: bash
        run: bash scripts/headcheck.sh
